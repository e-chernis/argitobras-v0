seo:
  title: "Semillas de Barro | Ceramica para pedidos grandes y eventos"
  description: "Semillas de Barro crea piezas de ceramica para eventos y grandes pedidos: bijouterie, vajilla, adornos, cuadros y ceramica artistica."
hero:
  eyebrow: "Semillas de Barro"
  title: "Ceramica en horno para grandes pedidos y eventos"
  subtitle: "Produccion artesanal con planificacion y consistencia para entregas en volumen."
  highlight: "Ideal para eventos, souvenirs, vajilla tematica y piezas decorativas personalizadas."
  primary_cta:
    text: "Pedir propuesta para evento"
    url: "#proceso-eventos"
    aria_label: "Ir a la seccion de proceso para pedidos de eventos"
  secondary_cta:
    text: "Ver servicios"
    url: "#servicios"
    aria_label: "Ir a la seccion de servicios de Semillas de Barro"
what_does:
  id: "que-hace"
  title: "Que hace Semillas de Barro"
  subtitle: "Piezas de ceramica horneada para uso cotidiano, decoracion y regalos de eventos."
  items:
    - title: "Produccion para eventos"
      description: "Lotes organizados con enfoque en calidad, coherencia y tiempos de entrega."
    - title: "Piezas artisticas"
      description: "Diseno y terminaciones con identidad propia para colecciones o regalos especiales."
    - title: "Trabajo por encargo"
      description: "Adaptacion de propuestas segun cantidad, estilo visual y presupuesto."
services:
  id: "servicios"
  title: "Servicios"
  subtitle: "Linea principal de productos y proyectos para eventos."
  items:
    - title: "Bijouterie de ceramica"
      description: "Aros, colgantes y piezas livianas con diseno artesanal."
    - title: "Ceramica artistica"
      description: "Objetos unicos para decoracion, regalo o coleccion."
    - title: "Vajilla de ceramica"
      description: "Tazas, platos y sets para uso diario o mesas tematicas."
    - title: "Adornos de ceramica"
      description: "Piezas decorativas para hogar, oficina o ambientacion de eventos."
    - title: "Cuadros de ceramica"
      description: "Composiciones murales con enfoque artistico y personalizado."
    - title: "Pedidos grandes y para eventos"
      description: "Produccion planificada para fechas especiales, empresas y celebraciones."
process:
  id: "proceso-eventos"
  title: "Proceso de pedido para eventos"
  subtitle: "Un flujo simple para definir, producir y entregar sin sorpresas."
  steps:
    - title: "1. Brief inicial"
      description: "Definimos cantidad, tipo de pieza, fecha objetivo y estilo general."
    - title: "2. Propuesta y validacion"
      description: "Se presenta una propuesta de diseno y alcance para confirmar antes de producir."
    - title: "3. Produccion en lote"
      description: "Fabricacion por etapas, secado y horneado segun tiempos tecnicos de ceramica."
    - title: "4. Entrega"
      description: "Se coordina retiro o envio con control final de piezas y empaque."
gallery:
  id: "galeria"
  title: "Galeria"
  subtitle: "Espacio preparado para sumar fotos reales de trabajos y eventos."
  items:
    - label: "Placeholder 1"
      alt: "Muestra de bijouterie de ceramica para evento"
    - label: "Placeholder 2"
      alt: "Muestra de vajilla de ceramica artesanal"
    - label: "Placeholder 3"
      alt: "Muestra de adornos de ceramica para souvenirs"
cross_link:
  title: "Necesitas confeccion, arreglos o diseno textil?"

seo:
  title: "Cotitas Dely | Maquinista y arreglos textiles en Argitobras"
  description: "Cotitas Dely: maquinista con experiencia en recta, collareta y overlock. Confeccion, arreglos, diseno textil, amigurumis y trabajos a medida."
hero:
  eyebrow: "Cotitas Dely"
  title: "Maquinista textil para prendas y proyectos a medida"
  subtitle: "La sentas en la maquina y sabe que hacer con la prenda. Trabajo prolijo, claro y orientado a resultados reales."
  highlight: "Domina maquina recta, collareta y overlock para resolver desde arreglos simples hasta disenos completos."
  primary_cta:
    text: "Pedir presupuesto"
    url: "#contacto"
    aria_label: "Ir a la seccion para pedir presupuesto de Cotitas Dely"
  secondary_cta:
    text: "Ver servicios"
    url: "#servicios"
    aria_label: "Ir a la seccion de servicios de Cotitas Dely"
what_does:
  id: "que-hace"
  title: "Que hace Cotitas Dely"
  subtitle: "Soluciones textiles para uso diario, hogar y piezas con valor artistico."
  items:
    - title: "Confeccion y arreglo de ropa"
      description: "Ajustes, reparaciones y piezas nuevas segun necesidad, tipo de tela y uso de la prenda."
    - title: "Arreglos de todo tipo"
      description: "Costuras abiertas, cierres, ruedos, pinzas, ajustes de talle y mejoras funcionales."
    - title: "Diseno de ropa"
      description: "Ideas personalizadas para prendas unicas, priorizando comodidad y terminacion prolija."
machines:
  id: "maquinas"
  title: "Maquinas que domina"
  subtitle: "Terminologia normalizada para una comunicacion clara con clientes."
  items:
    - title: "Recta"
      description: "Costuras base, uniones principales y armado general de prendas."
    - title: "Collareta"
      description: "Terminaciones elasticas, dobladillos y detalles en tejido de punto."
    - title: "Overlock"
      description: "Remallado y terminacion profesional de bordes para mayor durabilidad."
services:
  id: "servicios"
  title: "Servicios"
  subtitle: "Trabajo artesanal y tecnico en textil, dibujo y expresion artistica."
  items:
    - title: "Amigurumis"
      description: "Piezas tejidas a crochet para regalos, decoracion o coleccion."
    - title: "Tapizado de sillas"
      description: "Renovacion de sillas con enfoque en resistencia, uso diario y estilo."
    - title: "Almohadones para sillones"
      description: "Confeccion y recuperacion de almohadones con telas y rellenos adecuados."
    - title: "Acolchados"
      description: "Realizacion y arreglo de acolchados para hogar y proyectos personalizados."
    - title: "Diseno artistico"
      description: "Combinacion de tecnica textil con mirada creativa para piezas distintivas."
    - title: "Pintura en tela"
      description: "Intervenciones decorativas sobre prendas y textiles para hogar."
    - title: "Dibujo"
      description: "Bocetos e ideas visuales para acompanar proyectos textiles y decorativos."
    - title: "Dibujo tecnico"
      description: "Definicion de medidas y detalles para ejecucion precisa."
cross_link:
  title: "Buscas ceramica para eventos?"
  text: "Si necesitas piezas para pedidos grandes, souvenirs o vajilla artistica, visita la pagina de Semillas de Barro."
  actions:
    - text: "Visitar Semillas de Barro"
      url: "/semillasdebarro/"
      aria_label: "Ir a la pagina Semillas de Barro"
cta:
  title: "Contame que prenda o proyecto queres resolver"
  text: "Recibi una respuesta clara sobre tiempos, materiales y costo estimado."
  actions:

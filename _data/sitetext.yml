  about:
    title: "About Me"
    text: "Passionate DevOps Engineer"
    body: "I am a professional DevOps Engineer certified in AWS, with a focus on implementing best practices to improve system efficiency, stability, and scalability. I have experience in Linux and Windows system administration, transactional and non-transactional databases, security implementation, network management, monitoring, and alerting. I also possess decision-making skills aligned with SRE responsibilities. I specialize in CI/CD implementation and automation. I demonstrate the ability to lead technical implementations and provide guidance on projects, effectively communicating challenges and solutions. I excel in teamwork, collaborating with colleagues from different disciplines to achieve common goals and feedback. I am committed to maintaining high professionalism and dedication to team and organization success. Committed to delivering fast and reliable high-quality software, applying agile and DevOps principles throughout the software development lifecycle. My goal is to continue advancing in DevOps, contributing significantly to projects."

    events:
      - title: "SRE Admin / Ingeniero DevOps en Redbee Studios"
        year: "Julio 2021 - Presente"
        desc: "Lidero iniciativas de automatización y mejora continua sobre AWS Cloud. Diseño y mantengo infraestructura como código, repositorios de microservicios, pipelines de CI/CD, monitoreo y controles de seguridad para sostener plataformas escalables y de alta disponibilidad."

es: &DEFAULT_ES
  header:
    title: ¡Bienvenido a mi Portafolio!
    text: Ingeniero DevOps certificado en AWS, con foco en automatización, CI/CD, observabilidad y plataformas críticas.
    button: Saber Más
    buttonlink: "#nosotros"

  services:
    title: "Habilidades y especialidades"
    text: "Perfil DevOps orientado a confiabilidad, automatización, seguridad y escalabilidad en entornos críticos."
    section: servicios
    list:
      - title: "Infraestructura como Código (IaC)"
        desc: "Diseño e implementación de IaC con Terraform y Terragrunt en AWS, con foco en consistencia, trazabilidad y eficiencia operativa."
        icon: fas fa-cloud
      - title: "CI/CD y Automatización"
        desc: "Construcción y mantenimiento de pipelines con Jenkins, GitLab CI y Ansible; trunk-based development y despliegues GitOps con ArgoCD."
        icon: fas fa-cogs
      - title: "Monitoreo y Observabilidad"
        desc: "Observabilidad end-to-end con Prometheus, Grafana, CloudWatch, Zabbix, ELK/OpenSearch y FluentBit para métricas, logs y alertas proactivas."
        icon: fas fa-chart-line
      - title: "Seguridad y Mejores Prácticas"
        desc: "Gestión de IAM, mTLS, Keycloak y buenas prácticas SRE/DevOps, trabajando bajo Scrum con documentación técnica en Jira y Confluence."
        icon: fas fa-shield-alt
      - title: "Orquestación y Contenedores"
        desc: "Administración de Kubernetes (EKS), Docker Swarm, despliegues con Helm, gestión de clústeres para alta disponibilidad y escalabilidad."
        icon: fas fa-cube
      - title: "Scripting y Automatización"
        desc: "Desarrollo de scripts y automatización en Python, Bash, PowerShell, Go y Groovy; reducción de tareas repetitivas y optimización de flujos operativos."
        icon: fas fa-code
      - title: "Bases de datos y Cache"
        desc: "Administración y optimización de PostgreSQL, MySQL, MariaDB, Redis, MongoDB, MS-SQL Server; garantizando disponibilidad, rendimiento y consistencia de datos."
        icon: fas fa-database
      - title: "Redes e Infraestructura"
        desc: "Configuración de redes corporativas, VLAN, routing, switching, VPN, API Gateway con dominios personalizados, seguridad en tránsito (mTLS) y compliance."
        icon: fas fa-network-wired

  portfolio:
    title: "Experiencia laboral"
    text: "Implementaciones destacadas en seguridad de pagos, automatización, plataformas cloud y operación de servicios críticos."
    section: portafolio
    closebutton: "Cerrar Proyecto"

  timeline:
    title: "Mi Trayectoria Profesional"
    text: "Un recorrido claro por mi evolución profesional en DevOps, automatización e infraestructura crítica."
    section: cronologia
    events:
      - title: "SRE Admin / Ingeniero DevOps en Redbee Studios"
        year: "Julio 2021 - Presente"
        desc: "Como DevOps Engineer lidero implementaciones en AWS Cloud para mejorar eficiencia, estabilidad y escalabilidad. Implementé IaC con Terraform/Terragrunt, pipelines CI/CD con Jenkins y GitLab CI, GitOps con ArgoCD y despliegues sobre EKS con Helm. También trabajé en API Gateway con dominios personalizados y mTLS, integración de Keycloak, monitoreo con Prometheus/Grafana/CloudWatch/Zabbix y gestión de logs con OpenSearch, FluentBit y ELK."
        image: https://cessi.org.ar/wp-content/uploads/2025/05/redbee.png.webp
        alt: Redbee Studios
      - title: "SRE Admin / Ingeniero DevOps en Balanz Capital Valores"
        year: "Agosto 2019 - Julio 2021"
        desc: "Impulsé automatización y entrega continua para equipos técnicos y administrativos. Desarrollé pipelines con Jenkins/Ansible/Bitbucket, administré Kubernetes y Docker Swarm, y fortalecí observabilidad con Zabbix, Grafana y Prometheus. Además gestioné ELK/Filebeat, automatización con Bash y Ansible, y operación de bases MySQL, PostgreSQL, MariaDB, Redis y MongoDB."
        image: https://play-lh.googleusercontent.com/Msi21qkkkoo35j7P2o2_uxMhpUH4C1xub8sQA_4KJH32SNaWNdgwZmQ1rASYd2dGP-E
        alt: Balanz Capital
      - title: "Analista de Sistemas IT / Ingeniero Jr. DevOps en MercadoLibre"
        year: "Septiembre 2017 - Enero 2019"
        desc: "Brindé soporte técnico interno N1 en tres oficinas de CABA y mejoré la operación diaria con automatizaciones en Python, Bash y PowerShell. Trabajé sobre Windows, macOS y Linux; redes corporativas (VLAN, routing/switching, access points), Active Directory y cumplimiento de dispositivos. Participé en iniciativas de GCP e integración con APIs de Google, además de documentación técnica y gestión de procesos en entornos ágiles."
        image: https://grupoact.com.ar/wp-content/uploads/2022/01/mercado-libre-logo.svg
        alt: MercadoLibre
      - title: "Analista de Sistemas IT en Grupo Assa"
        year: "Julio 2015 - Junio 2017"
        desc: "Inicié administrando MS-SQL Server 2008/2012 y evolucioné hacia automatización en UNIX y Windows Server. Realicé scripting en T-SQL, PowerShell, Shell y Batch, troubleshooting de procesos y flujos FTP/SFTP/SSH, y operación con herramientas como TIDAL y MAESTRO. También participé en documentación y reingeniería de procesos críticos, con interacción técnica en inglés con equipos internacionales."
        image: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTv5C0tV-xR-v6_EMqW2BP61UhscklLzRVGAQ&s
        alt: Grupo Assa
      - title: "Desarrollador Java en Cidicom"
        year: "Febrero 2015 - Julio 2015"
        desc: "Lideré el desarrollo de una aplicación de escritorio en Java SE para gestión de empleados en una empresa de remolcadores, cubriendo control de accesos, asignación de turnos y administración operativa. Implementé base transaccional en MySQL, autenticación segura, reportes PDF/Excel e integración con TANGO, optimizando rendimiento y operación del sistema."
        image: https://cidi.com.ar/template/assets/images/general/CIDICOM_Header.png
        alt: Cidicom
    end: ""
    end_image: ""
    end_alt: ""

  about:
    title: "Sobre Mí"
    text: "Ingeniero DevOps certificado en AWS"
    body: "Soy un profesional DevOps enfocado en implementar mejores prácticas para mejorar la eficiencia, estabilidad y escalabilidad de sistemas. Tengo experiencia en administración Linux y Windows, bases de datos transaccionales y no transaccionales, seguridad, redes, monitoreo y alertamiento, con enfoque de confiabilidad tipo SRE. Me especializo en CI/CD y automatización, y en liderar técnicamente implementaciones con comunicación clara entre áreas técnicas y de negocio. Trabajo de forma colaborativa con equipos multidisciplinarios bajo metodologías ágiles, manteniendo un alto estándar de profesionalismo y compromiso con entregas rápidas, confiables y de alta calidad."

        alt: Redbee Studios
      - title: "SRE Admin / Ingeniero DevOps en Balanz Capital Valores"
        year: "Agosto 2019 - Julio 2021"
        desc: "Automatizamos la entrega continua de servicios y desarrollos, simplificando el trabajo de los equipos técnicos y de negocio. También administré infraestructura Linux, cubriendo provisión, configuración, mantenimiento y monitoreo de servicios críticos."
        image: https://play-lh.googleusercontent.com/Msi21qkkkoo35j7P2o2_uxMhpUH4C1xub8sQA_4KJH32SNaWNdgwZmQ1rASYd2dGP-E
        alt: Balanz Capital
      - title: "Analista de Sistemas IT / Ingeniero Jr. DevOps en MercadoLibre"
        year: "Septiembre 2017 - Enero 2019"
        desc: "Brindé soporte técnico interno de Nivel 1 en tres oficinas de la Zona Sur de CABA. Además, participé en automatizaciones y mejoras operativas que acompañaron la migración a GCP y el trabajo diario de los equipos."
        image: https://grupoact.com.ar/wp-content/uploads/2022/01/mercado-libre-logo.svg
        alt: MercadoLibre
      - title: "Analista de Sistemas IT en Grupo Assa"
        year: "Julio 2015 - Junio 2017"
        desc: "Comencé administrando bases de datos MS-SQL Server 2008 y 2012, asegurando continuidad operativa y consultas eficientes. Más tarde me integré a un equipo de desarrollo, donde profundicé en automatización para entornos UNIX y Windows Server."
        image: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTv5C0tV-xR-v6_EMqW2BP61UhscklLzRVGAQ&s
        alt: Grupo Assa
      - title: "Desarrollador Java en Cidicom"
        year: "Febrero 2015 - Julio 2015"
        desc: "Desarrollé un sistema de gestión de empleados para una empresa de remolcadores. La solución ayudaba a controlar accesos, asignar turnos y administrar información clave sobre barcos y tripulaciones."
        image: https://cidi.com.ar/template/assets/images/general/CIDICOM_Header.png
        alt: Cidicom
    end: ""
    end_image: ""
    end_alt: ""


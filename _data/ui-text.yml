    text: "Specialized in DevOps, cloud infrastructure, CI/CD, and automation."
    section: services
    list:
      - title: "AWS Cloud"
        desc: "Expertise in AWS services including EKS, S3, Lambda, API Gateway, IAM, CloudWatch, and more. Infrastructure as Code with Terraform and Terragrunt."
        icon: fas fa-cloud
      - title: "CI/CD & Automation"
        desc: "Proficient in Jenkins, GitLab CI, Ansible, Bash, Python, Groovy, Go. Trunk-based development and GitOps with ArgoCD."
        icon: fas fa-cogs
      - title: "Databases & Monitoring"
        desc: "Experience with PostgreSQL, MySQL, Redis, Elasticsearch. Monitoring with Prometheus, Grafana, Zabbix, ELK Stack."
        icon: fas fa-database
      - title: "DevOps Practices"
        desc: "Agile methodologies, Scrum, SRE principles, security best practices, and collaborative team leadership."
        icon: fas fa-users
